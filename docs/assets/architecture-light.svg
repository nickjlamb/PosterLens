<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="PosterLens architecture: capture and OCR run on device and only extracted text leaves the phone; reasoning produces a structured summary, categories, questions and chat; evidence retrieval runs over a PubMed corpus and every citation is validated against PubMed E-utilities — failures are dropped; results land in a per-scan store with PDF export.">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker></defs>
<rect x="16" y="52" width="200" height="448" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="34" y="78" font-size="11" font-weight="600" letter-spacing="1.5" fill="#59636e">ON DEVICE</text>
<text x="34" y="482" font-size="11" font-style="italic" fill="#59636e">the photo never leaves the phone</text>
<rect x="31.0" y="120" width="170" height="52" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="116" y="142" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Camera capture</text>
<text x="116" y="160" font-size="11" text-anchor="middle" fill="#59636e">edge detection &#183; stable frame</text>
<polyline points="116,172 116,228" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="31.0" y="230" width="170" height="52" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="116" y="252" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Vision OCR</text>
<text x="116" y="270" font-size="11" text-anchor="middle" fill="#59636e">on-device &#183; notation repair</text>
<polyline points="201,248 252,248 252,118 317,118" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arr)"/>
<polyline points="201,264 252,264 252,422" fill="none" stroke="#8c959f" stroke-width="1.5"/>
<polyline points="252,342 289,342" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arr)"/>
<polyline points="252,422 289,422" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="234" y="330" font-size="11" fill="#59636e" text-anchor="middle" transform="rotate(-90 234 330)">extracted text &#8212; never the photo</text>
<rect x="276" y="52" width="436" height="200" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="294" y="78" font-size="11" font-weight="600" letter-spacing="1.5" fill="#59636e">REASONING &#183; EXTRACTED TEXT ONLY</text>
<rect x="319.0" y="92" width="350" height="52" rx="8" fill="#fbf0ff" stroke="#8250df"/>
<text x="494" y="114" font-size="13" font-weight="600" text-anchor="middle" fill="#8250df">Structured summary</text>
<text x="494" y="132" font-size="11" text-anchor="middle" fill="#59636e">GPT &#183; six fields &#183; endpoints verbatim only</text>
<polyline points="494,144 494,168" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="319.0" y="170" width="350" height="52" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="494" y="192" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Categories &#183; questions &#183; chat</text>
<text x="494" y="210" font-size="11" text-anchor="middle" fill="#59636e">all grounded in the captured text</text>
<rect x="276" y="282" width="436" height="218" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="294" y="308" font-size="11" font-weight="600" letter-spacing="1.5" fill="#59636e">EVIDENCE &#183; RETRIEVE, THEN VERIFY</text>
<rect x="291.0" y="316" width="200" height="52" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="391" y="338" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">evidence_v2 &#183; RAG</text>
<text x="391" y="356" font-size="11" text-anchor="middle" fill="#59636e">embed &#183; vector search &#183; re-rank</text>
<rect x="291.0" y="396" width="200" height="52" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="391" y="418" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Perplexity Search</text>
<text x="391" y="436" font-size="11" text-anchor="middle" fill="#59636e">legacy path &#183; domain-filtered</text>
<rect x="512.0" y="352" width="188" height="56" rx="8" fill="#dafbe1" stroke="#aceebb"/>
<text x="606" y="374" font-size="13" font-weight="600" text-anchor="middle" fill="#1a7f37">PubMed check</text>
<text x="606" y="392" font-size="11" text-anchor="middle" fill="#59636e">every citation validated</text>
<polyline points="491,342 503,342 503,368 512,368" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arr)"/>
<polyline points="491,422 503,422 503,392 512,392" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arr)"/>
<polyline points="606,408 606,436" fill="none" stroke="#cf222e" stroke-width="1.5" marker-end="url(#arr-red)"/>
<text x="590" y="454" font-size="11" font-weight="600" text-anchor="middle" fill="#cf222e">&#10005; fails validation &#8212; dropped, never shown</text>
<rect x="742" y="52" width="202" height="448" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="760" y="78" font-size="11" font-weight="600" letter-spacing="1.5" fill="#59636e">OUTPUT</text>
<rect x="758.0" y="196" width="170" height="52" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="843" y="218" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Per-scan store</text>
<text x="843" y="236" font-size="11" text-anchor="middle" fill="#59636e">iCloud &#183; local fallback</text>
<polyline points="843,248 843,326" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="773.0" y="330" width="140" height="44" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="843" y="356.5" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">PDF export</text>
<polyline points="669,196 728,196 728,214 756,214" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="718" y="188" font-size="11" fill="#59636e" text-anchor="end">summary + context</text>
<polyline points="700,372 716,372 716,232 756,232" fill="none" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#arr-green)"/>
<text x="702" y="302" font-size="11" font-weight="600" fill="#1a7f37" text-anchor="middle" transform="rotate(-90 702 302)">verified citations only</text>
</svg>